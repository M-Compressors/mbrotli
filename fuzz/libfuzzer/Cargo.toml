[package]
name = "mbrotli-libfuzzer"
version = "0.1.0"
edition = "2024"
publish = false
description = "libFuzzer adapters over the engine-neutral mbrotli AFL target bodies, for ClusterFuzzLite"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# The target bodies, oracles and C reference live in the AFL package's library,
# which names no AFL symbol: only its own `src/bin/` adapters do, and nothing
# here links those.
[dependencies.mbrotli-afl]
path = "../afl"

[features]
default = []
# Enable the RFC 9841 targets and their independent C parser/decoder oracle.
experimental = ["mbrotli-afl/experimental"]

[profile.release]
debug = true
codegen-units = 1

[[bin]]
name = "c_abi"
path = "fuzz_targets/c_abi.rs"
test = false
doc = false
bench = false

