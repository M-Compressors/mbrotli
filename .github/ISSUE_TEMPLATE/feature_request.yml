name: Feature request
description: Suggest a new API, parameter, or capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The [Compatibility](https://github.com/M-Compressors/mbrotli#compatibility)
        section of the README lists what is supported today, including the
        formats behind the `experimental` feature.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behavior you would like. If Google Brotli has an equivalent, name it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself.
