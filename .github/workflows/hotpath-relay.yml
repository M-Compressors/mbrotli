name: hotpath relay

on:
  workflow_run:
    workflows: ["hotpath benchmark"]
    types: [completed]

jobs:
  relay:
    uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@f98dee237c49087e20b94b62bcd9becfceeee357 # v0.29.2
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    with:
      benchmark: compressor
      artifact_name: compressor-report
      report_file: compressor-report.json
