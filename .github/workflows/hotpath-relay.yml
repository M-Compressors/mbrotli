name: hotpath relay

on:
  workflow_run:
    workflows: ["hotpath benchmark", "hotpath criterion"]
    types: [completed]

permissions: {}

# `workflows:` matches by name: renaming a benchmark workflow stops its relay.
jobs:
  relay:
    name: relay compressor benchmark
    if: >-
      github.event.workflow_run.name == 'hotpath benchmark' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    concurrency:
      group: hotpath-relay-compressor-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - uses: hotpath-rs/hotpath-relay@d40b0e465fa852b0c1f4e33989140d11d7b2742c # v1.0.0
        with:
          benchmark: compressor
          artifact_name: compressor-report
          report_file: compressor-report.json

  # Keep in sync with the `hotpath-criterion.yml` matrix.
  criterion:
    name: relay ${{ matrix.series }} benchmark
    if: >-
      github.event.workflow_run.name == 'hotpath criterion' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        series:
          - decompress-cold-q11-mbrotli-vendor-alice29.txt
          - compress-cold-q5-mbrotli-vendor-alice29.txt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    concurrency:
      group: hotpath-relay-${{ matrix.series }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - uses: hotpath-rs/hotpath-relay@d40b0e465fa852b0c1f4e33989140d11d7b2742c # v1.0.0
        with:
          benchmark: ${{ matrix.series }}
          artifact_name: criterion-${{ matrix.series }}
          report_file: criterion-report.json
