name: hotpath relay

on:
  workflow_run:
    workflows: ["hotpath benchmark"]
    types: [completed]

jobs:
  relay:
    uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@6611490c8b1b33b69c4845e86daa450a50f461c6 # v0.30.0
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    with:
      benchmark: compressor
      artifact_name: compressor-report
      report_file: compressor-report.json
