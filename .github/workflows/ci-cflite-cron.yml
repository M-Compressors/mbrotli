name: CI ClusterFuzzLite cron

# Daily continuous fuzzing. Corpora, crashes and coverage reports are kept as
# workflow artifacts, which is ClusterFuzzLite's default storage on GitHub.
# The jobs run in sequence: batch fuzzing grows the corpus, pruning keeps it
# minimal (ClusterFuzzLite requires pruning whenever batch fuzzing runs), and
# coverage reports on the pruned corpus for PR code-change mode to use.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  batch:
    name: batch fuzzing
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at six hours, image and fuzzer builds included.
    # The fuzzing budget is split evenly among the targets, and each target
    # also spends about 45 s outside it on corpus download, crash
    # reproduction and upload. With 25 targets and a 28 minute build, 5.5
    # hours of fuzzing (run 41189734130) overran by two minutes, and earlier
    # runs finished with under two to spare. 17400 s comes to about 5 h 36 min
    # in total, which leaves room for slower builds and a few more targets.
    timeout-minutes: 360
    steps:
      - name: build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          sanitizer: address
      - name: run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 17400
          mode: batch
          sanitizer: address
          # Run one libFuzzer process per runner core for each target; the
          # targets still take turns and share the budget evenly.
          parallel-fuzzing: true

  prune:
    name: corpus pruning
    needs: batch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Merge timeouts below are allowances, not a requested run duration.
    # Bound the whole job, including the builds, independently.
    timeout-minutes: 360
    steps:
      - name: build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
      - name: prune corpora
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # ClusterFuzzLite divides this budget among remaining targets to
          # set each merge's timeout. In run 43207937695, 14400 s allowed
          # encoder_session only ~633 s for 6579 inputs and timed out.
          # 45000 s gives the current 25 targets at least 30 minutes each;
          # fast merges finish immediately and leave time for later ones.
          # This sum of allowances can exceed the job's six-hour wall limit:
          # pruning does not spend unused time, unlike batch fuzzing.
          fuzz-seconds: 45000
          mode: prune

  coverage:
    name: coverage report
    needs: prune
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          sanitizer: coverage
      - name: report coverage
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: coverage
          sanitizer: coverage
