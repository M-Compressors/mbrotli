name: CI AddressSanitizer

# Run for every pushed tag, or on demand from Actions / the GitHub CLI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  simd-uninit:
    name: SIMD and uninitialized memory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      # Natively, the tests reach every SIMD level the runner detects. The
      # script adds `-Zsanitizer=address` and the explicit host target.
      - run: python3 scripts/check_simd_uninit.py asan

  address-sanitizer:
    name: address sanitizer
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - run: >
          cargo test --release --target x86_64-unknown-linux-gnu
          --features experimental --test reuse --test writer_faults
          --test streaming --test simd_backends --test dictionary
          --test decompress --test decompress_c --test decompress_wire
          --test decompress_contract --test decompress_io --test serialized_dictionary
          --test framed_decoder
