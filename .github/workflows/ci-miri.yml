name: CI Miri

# Run for every pushed tag, or on demand from Actions / the GitHub CLI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  simd-uninit:
    name: SIMD and uninitialized memory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      # Miri reports runtime-detected CPU features as absent, so it reaches
      # only the SIMD levels the build enables at compile time. `native`
      # enables every level the runner has: SSE2 through AVX2, or AVX-512 when
      # the runner supports it, on x86-64, and Neon on Arm.
      RUSTFLAGS: -Ctarget-cpu=native
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Selects tests by name prefix and fails a prefix that runs no test;
      # see the script for the module list.
      - run: python3 scripts/check_simd_uninit.py miri

  experimental:
    name: experimental decoder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test --test decompress_golden --features experimental
        env:
          MIRIFLAGS: -Zmiri-deterministic-floats
      - run: cargo miri test --lib --features experimental decompressor::framing::core::wire::tests
        env:
          MIRIFLAGS: -Zmiri-deterministic-floats
