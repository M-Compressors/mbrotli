name: CI Miri

# Run for every pushed tag, or on demand from Actions / the GitHub CLI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  simd-uninit:
    name: SIMD and uninitialized memory (${{ matrix.platform.arch }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.platform.os }}
    # Each shard is sized to finish within ten minutes; a longer run means a
    # test outgrew its Miri inputs, which should fail fast rather than hold
    # the runner for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Miri reports runtime-detected CPU features as absent, so it reaches
        # only the SIMD levels the build enables at compile time. x86-64-v3
        # enables SSE2 through AVX2, the highest level Miri can interpret: it
        # has no shims for the AVX-512 intrinsics, and `native` would make the
        # run depend on which runner the job lands on. Neon is part of the
        # ARM64 baseline.
        platform:
          - { arch: x86-64, os: ubuntu-latest, rustflags: -Ctarget-cpu=x86-64-v3 }
          - { arch: arm64, os: ubuntu-24.04-arm, rustflags: '' }
        shard: [1, 2, 3, 4]
    env:
      RUSTFLAGS: ${{ matrix.platform.rustflags }}
      RUSTDOCFLAGS: ${{ matrix.platform.rustflags }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Selects tests by name prefix and fails a prefix that runs no test;
      # see the script for the module list.
      - run: python3 scripts/check_simd_uninit.py miri --shard ${{ matrix.shard }}/4

  experimental:
    name: experimental decoder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test --test decompress_golden --features experimental
        env:
          MIRIFLAGS: -Zmiri-deterministic-floats
      - run: cargo miri test --lib --features experimental decompressor::framing::core::wire::tests
        env:
          MIRIFLAGS: -Zmiri-deterministic-floats
